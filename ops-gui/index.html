<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Automation problems</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page">
    <header class="hero">
      <p class="brand">Ops</p>
      <h1>Automation problems</h1>
      <p class="lede">
        When a Discord or n8n automation fails, it shows up here in plain language.
        You can retry or dismiss without opening n8n.
      </p>
      <div class="toolbar">
        <button type="button" id="btn-refresh" class="btn secondary">Refresh</button>
        <button type="button" id="btn-demo" class="btn secondary">Add sample error</button>
        <label class="filter">
          Show
          <select id="status-filter">
            <option value="open" selected>Open</option>
            <option value="resolved">Fixed</option>
            <option value="dismissed">Dismissed</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
      <p id="status-line" class="status-line" aria-live="polite"></p>
    </header>

    <main>
      <ul id="error-list" class="error-list"></ul>
      <p id="empty" class="empty hidden">No problems in this list. You’re clear.</p>
    </main>
  </div>
  <script src="./app.js"></script>
</body>
</html>
